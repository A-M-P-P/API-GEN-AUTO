spring:
  datasource:
    url: ${APIGEN_DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    driver-class-name: oracle.jdbc.OracleDriver
    username: ${APIGEN_DB_USER:apigen}
    password: ${APIGEN_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${APIGEN_DB_POOL_MAX:15}
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
  h2:
    console:
      enabled: false
  flyway:
    locations: classpath:db/migration

apigen:
  seed:
    demo: false
  scheduler:
    enabled: true

logging:
  level:
    com.apigen: INFO
    org.hibernate.SQL: WARN

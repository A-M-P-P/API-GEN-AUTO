# Production — base Oracle 12c (SID ORCL, utilisateur sigif)
# Les valeurs par défaut correspondent à la base de production ; elles restent surchargeables
# par variables d'environnement ou par le fichier externe config/runtime.properties.
spring:
  datasource:
    url: ${APIGEN_DB_URL:jdbc:oracle:thin:@${ORACLE_HOST:localhost}:${ORACLE_PORT:1521}:${ORACLE_SID:ORCL}}
    driver-class-name: oracle.jdbc.OracleDriver
    username: ${APIGEN_DB_USER:sigif}
    password: ${APIGEN_DB_PASSWORD:sigif2015}
    hikari:
      # Oracle 10g/11g : le pilote envoie sinon le nom de région de la JVM, inconnu du
      # fichier de fuseaux de la base -> ORA-01882. On force l'envoi d'un décalage.
      data-source-properties:
        oracle.jdbc.timezoneAsRegion: false
      maximum-pool-size: ${APIGEN_DB_POOL_MAX:15}
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    open-in-view: false
    hibernate:
      ddl-auto: none
  h2:
    console:
      enabled: false
  flyway:
    enabled: ${APIGEN_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

apigen:
  seed:
    demo: false
  scheduler:
    enabled: true

logging:
  level:
    com.apigen: INFO
    org.hibernate.SQL: WARN

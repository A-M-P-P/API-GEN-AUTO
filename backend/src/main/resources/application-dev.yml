# Base plateforme Oracle : utilisateur/schéma dédié APIGEN, jamais un compte métier.
spring:
  datasource:
    url: ${APIGEN_DB_URL:jdbc:oracle:thin:@${ORACLE_HOST:localhost}:${ORACLE_PORT:1521}:${ORACLE_SID:ORCL}}
    driver-class-name: oracle.jdbc.OracleDriver
    username: ${APIGEN_DB_USER:APIGEN}
    password: ${APIGEN_DB_PASSWORD:A_REMPLACER}
    hikari:
      # Oracle 10g/11g : le pilote envoie sinon le nom de région de la JVM, inconnu du
      # fichier de fuseaux de la base -> ORA-01882. On force l'envoi d'un décalage.
      data-source-properties:
        oracle.jdbc.timezoneAsRegion: false
      maximum-pool-size: ${APIGEN_DB_POOL_MAX:10}
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: ${APIGEN_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    # Refuser un schéma non vide sans historique : éviter de toucher à une base métier.
    baseline-on-migrate: false
    baseline-version: 0

apigen:
  seed:
    demo: ${APIGEN_SEED_DEMO:true}

logging:
  level:
    com.apigen: DEBUG
    org.hibernate.SQL: WARN

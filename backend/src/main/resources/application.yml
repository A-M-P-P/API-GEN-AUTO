spring:
  application:
    name: apigen-platform
  profiles:
    active: ${APIGEN_PROFILE:dev}
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false
        # Les horodatages du domaine sont des java.time.Instant. Hibernate 6.5 les mappe
        # par défaut en TIMESTAMP_UTC et les lit avec getObject(OffsetDateTime.class),
        # ce qui échoue sur Oracle 12c (ORA-18716) lorsque la colonne est un DATE/TIMESTAMP
        # sans fuseau. On force le JDBC TIMESTAMP classique : compatible Oracle 12c et H2.
        type:
          preferred_instant_jdbc_type: TIMESTAMP
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Schéma Oracle partagé avec d'autres applications : on pose une base de référence
    # au lieu d'échouer sur un schéma non vide sans historique Flyway.
    baseline-on-migrate: true
    baseline-version: 0
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: ${SERVER_PORT:8081}
  error:
    include-message: always
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

apigen:
  jwt:
    # En production : APIGEN_JWT_SECRET doit être une valeur longue et aléatoire.
    secret: ${APIGEN_JWT_SECRET:dev-only-change-me-0123456789abcdef0123456789abcdef}
    expiration-hours: ${APIGEN_JWT_EXPIRATION_HOURS:8}
    issuer: apigen
  crypto:
    # Clé AES-256 (Base64 ou texte) utilisée pour chiffrer les secrets en base.
    key: ${APIGEN_CRYPTO_KEY:dev-only-crypto-key-change-me-0123456789}
  cors:
    allowed-origins: ${APIGEN_CORS_ORIGINS:http://localhost:4200,http://localhost:8081}
  scheduler:
    poll-interval-ms: ${APIGEN_SCHEDULER_POLL_MS:15000}
    enabled: ${APIGEN_SCHEDULER_ENABLED:true}
  seed:
    demo: ${APIGEN_SEED_DEMO:true}
  files:
    base-dir: ${APIGEN_FILES_BASE_DIR:./data/exchanges}
  audit:
    retention-days: ${APIGEN_AUDIT_RETENTION_DAYS:90}
  jdbc-pool:
    # Un pool HikariCP par base cible, fermé après cette période d'inactivité.
    evict-interval-ms: ${APIGEN_JDBC_POOL_EVICT_MS:300000}

logging:
  level:
    root: INFO
    com.apigen: INFO
    org.hibernate.SQL: WARN
    org.springframework.security: WARN
